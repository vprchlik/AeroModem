name: Deploy GitHub Pages

# Builds the static app and publishes to GitHub Pages on every push to main.
# Pages always serves over HTTPS — required for getUserMedia / AudioContext.
# Project-site URL: https://vprchlik.github.io/AeroModem/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Subpath base for the project site (/AeroModem/). Dev (`npm run dev`)
      # and local `npm run build` keep base=/ via vite.config.ts default.
      - run: npm run build
        env:
          VITE_BASE: /AeroModem/
      - name: Verify subpath asset paths and inlined worklets
        run: |
          set -euo pipefail
          test -f dist/index.html
          # Built HTML must reference assets under /AeroModem/, not /
          grep -q '/AeroModem/assets/' dist/index.html
          # Worklets are loaded via blob: URLs from ?raw-inlined sources —
          # the classic Vite relative-URL worklet break under a subpath must
          # not appear (no addModule of a relative .js asset path).
          MAIN_JS=$(ls dist/assets/main-*.js | head -1)
          grep -q 'aeromodem-playback' "$MAIN_JS"
          grep -q 'aeromodem-capture' "$MAIN_JS"
          if grep -E "addModule\(['\"][^b]" "$MAIN_JS"; then
            echo "ERROR: worklet addModule appears to use a non-blob URL"
            exit 1
          fi
          echo "Pages build OK: subpath assets + inlined worklets verified"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
